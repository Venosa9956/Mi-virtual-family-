name: Compilar .EXE y .APK (GitHub Releases)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Compilación de ejecutable de Windows (.EXE)
  build-windows:
    name: Compilar .EXE para Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar archivos web
        shell: bash
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
            npx vite build --base=./
          else
            mkdir -p dist
            cp -r *.html css js assets manifest.json *.png dist/ 2>/dev/null || true
          fi

      - name: Empaquetar ejecutable .EXE con Nativefier
        run: |
          npx --yes nativefier "dist/index.html" --name "OurFriendship2026" --platform "windows" --arch "x64" --single-instance --tray
          powershell Compress-Archive -Path "OurFriendship2026-win32-x64\*" -DestinationPath "OurFriendship-2026-Windows.zip"

      - name: Subir artefacto Windows
        uses: actions/upload-artifact@v4
        with:
          name: OurFriendship-2026-Windows
          path: OurFriendship-2026-Windows.zip

  # 2. Compilación de aplicación Android (.APK)
  build-android:
    name: Compilar .APK para Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Verificar Android SDK preinstalado
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          mkdir -p "$SDK_DIR/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$SDK_DIR/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"
          ls -la "$SDK_DIR/platforms" || true

      - name: Preparar compilación web
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
            npm run build
          else
            npm init -y
            mkdir -p dist
            cp -r *.html css js assets manifest.json *.png dist/ 2>/dev/null || true
          fi

      - name: Instalar Capacitor 6 para Android
        env:
          CI: true
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({appId:'com.domititan.ourfriendship',appName:'OurFriendship2026',webDir:'dist',bundledWebRuntime:false}, null, 2))"
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK generado
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk OurFriendship-2026-Android.apk

      - name: Subir artefacto Android APK
        uses: actions/upload-artifact@v4
        with:
          name: OurFriendship-2026-Android-APK
          path: OurFriendship-2026-Android.apk

  # 3. Publicación automática en GitHub Releases
  publish-release:
    name: Publicar en GitHub Releases
    needs: [build-windows, build-android]
    if: always() && needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefacto Windows
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: OurFriendship-2026-Windows

      - name: Descargar artefacto Android
        uses: actions/download-artifact@v4
        with:
          name: OurFriendship-2026-Android-APK

      - name: Crear GitHub Release con .EXE y .APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2026-${{ github.run_number }}
          files: |
            OurFriendship-2026-Android.apk
            OurFriendship-2026-Windows.zip
          fail_on_unmatched_files: false
          name: "Our Friendship 2026 — Descargas (Build #${{ github.run_number }})"
          body: |
            ## 💜 OUR FRIENDSHIP — THE 2026 ADVENTURE
            Descargas listas para instalar:
            - **`OurFriendship-2026-Android.apk`**: Instalador para dispositivos Android (.APK).
            - **`OurFriendship-2026-Windows.zip`**: Ejecutable de escritorio para Windows (.EXE incluido).
